{% extends "base.html" %}

{% block title %}{{ post.title }} — shikomba.me{% endblock %}
{% block meta_description %}{{ post.meta_description }}{% endblock %}

{% block content %}
<article>
    <h1>{{ post.title }}</h1>
    <p>{{ post.publish_date|date:"F j, Y" }}</p>
    <div>{{ post.body|linebreaks }}</div>
</article>
{% endblock %}
