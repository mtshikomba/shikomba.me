<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}shikomba.me{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Personal blog of the site owner.{% endblock %}">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.55;
            color: #242628;
            background: #FBF8F2;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 1rem;
        }
        header nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #E3D8CC;
        }
        header nav a {
            color: #242628;
            text-decoration: none;
            font-weight: 600;
        }
        header nav a[aria-current="page"] {
            color: #A8473A;
        }
        article + article { margin-top: 2rem; }
        .pagination { display: flex; gap: 1rem; padding: 1rem 0; }
        footer { padding: 1rem; text-align: center; color: #65706D; }
        img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Primary">
            <a href="{% url 'blog:post-list' %}" {% if request.resolver_match.url_name == 'post-list' %}aria-current="page"{% endif %}>Home</a>
            <a href="{% url 'blog:about' %}" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>About</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; {% now "Y" %} shikomba.me</p>
    </footer>
</body>
</html>
