<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}shikomba.me{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Personal blog of the site owner.{% endblock %}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-brand" href="{% url 'blog:post-list' %}" aria-label="shikomba.me home">
                <span class="site-brand__mark">S</span>
                <span>shikomba<span class="site-brand__dot">.</span>me</span>
            </a>
            <nav class="site-nav" aria-label="Primary">
            <a href="{% url 'blog:post-list' %}" {% if request.resolver_match.url_name == 'post-list' %}aria-current="page"{% endif %}>Blog</a>
            <a href="{% url 'projects:project-list' %}" {% if request.resolver_match.app_name == 'projects' %}aria-current="page"{% endif %}>Projects</a>
            <a href="{% url 'resume:resume-detail' %}" {% if request.resolver_match.app_name == 'resume' %}aria-current="page"{% endif %}>Resume</a>
            <a href="{% url 'research:research-list' %}" {% if request.resolver_match.app_name == 'research' %}aria-current="page"{% endif %}>Research</a>
            <a href="{% url 'blog:about' %}" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>About</a>
            </nav>
        </div>
    </header>
    <main id="main-content" class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="site-footer__inner">
            <p class="site-footer__brand">shikomba<span class="site-brand__dot">.</span>me</p>
            <nav class="site-footer__links" aria-label="Footer">
                <a href="{% url 'blog:about' %}">About</a>
                <a href="mailto:tangenishikomba@gmail.com">Email</a>
                <a href="https://www.linkedin.com/in/tangeni-shikomba">LinkedIn</a>
            </nav>
            <p class="site-footer__copy">&copy; {% now "Y" %} Tangeni Shikomba</p>
        </div>
    </footer>
</body>
</html>
